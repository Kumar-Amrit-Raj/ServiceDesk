name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: servicedesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d servicedesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/servicedesk
      JWT_SECRET: ci-only-secret-for-servicedesk-integration-tests
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Initialize PostgreSQL schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/src/database/schema.sql

      - name: Run backend integration tests
        run: npm test --prefix backend

      - name: Build frontend
        run: npm run build --prefix frontend
